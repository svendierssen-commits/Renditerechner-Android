name: Android APK mit Starttest
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK Pakete installieren
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android Emulator Starttest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n de.renditerechner.mobile/.MainActivity
            sleep 8
            adb shell pidof de.renditerechner.mobile || (adb logcat -d -t 1000 > crash-log.txt; cat crash-log.txt; exit 1)
            adb shell dumpsys activity activities | grep -q de.renditerechner.mobile || (adb logcat -d -t 1000 > crash-log.txt; cat crash-log.txt; exit 1)
            adb shell input tap 155 160
            adb shell pidof de.renditerechner.mobile
      - name: APK hochladen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Renditerechner-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Fehlerprotokoll
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Crashlog
          path: crash-log.txt
          if-no-files-found: ignore
